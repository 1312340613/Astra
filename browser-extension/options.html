<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Astra 浏览器活动</title>
<body style="font:16px system-ui;max-width:680px;margin:40px auto;line-height:1.7">
<h1>Astra 浏览器活动</h1>
<p>只记录前台普通网页的标题和网址。不会读取正文、表单或隐私窗口；网址中的参数和片段会被删除。标题和清理后的网址可能参与活动摘要。</p>
<p>Windows：先启动 scripts/activity-control.bat，再从项目的 .astra/windows-activity/browser-token.txt 复制配对码。</p>
<p>macOS：先运行 activity browser-install，再用 activity browser-token 复制配对码。Safari 暂不支持此扩展。</p>
<form id="settings">
<p><label>本地配对码 <input id="token" type="password" size="48" required autocomplete="off"></label></p>
<p><label><input id="enabled" type="checkbox">启用前台网址记录</label></p>
<p><label>排除域名（每行一个，同时排除子域名）<br><textarea id="domains" rows="6" cols="55" placeholder="example.com"></textarea></label></p>
<button type="submit">保存</button>
</form>
<p id="message" role="status"></p><p id="status"></p>
<script src="options.js"></script>
</body></html>
