<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Astra CU Form Reliability</title>
<style>body{font:16px system-ui;max-width:960px;margin:24px auto;background:#f7f9fc;color:#182435}h1{font-size:25px}fieldset{display:inline-block;width:42%;border:1px solid #d6dfed;background:white;margin:5px;padding:10px}label{margin-right:18px;cursor:pointer}input{width:18px;height:18px;vertical-align:middle}button{padding:10px 18px;margin:12px 10px 12px 0}#status{font-weight:600;color:#245fc7}</style>
<h1>Astra CU Form Reliability</h1><p>Local ten-question fixture. Select True for every question. Leave Submit untouched.</p>
<button id="reset" type="button">Reset fixture</button><span id="status" role="status">0 / 10 selected</span>
<div id="content"></div><button id="submit" type="button">Submit sentinel</button>
<script>
let selectedClicks=0,submits=0,run=0;
let node=document.querySelector('#content');
// Explicit groups survive Chromium's accessibility-tree simplification.
for(let i=0;i<26;i++){const group=document.createElement('div');group.setAttribute('role','group');group.setAttribute('aria-label','Form level '+i);node.append(group);node=group;}
for(let i=1;i<=10;i++){
 const question=document.createElement('fieldset');question.setAttribute('role','group');question.setAttribute('aria-label','Question '+i);
 question.innerHTML=`<legend>Question ${i}</legend><label><input id="q${i}true" name="q${i}" type="radio">True</label><label><input id="q${i}false" name="q${i}" type="radio">False</label>`;
 node.append(question);
}
function publish(){
 const selected=[...document.querySelectorAll('input:checked')].map(el=>el.id);
 document.querySelector('#status').textContent=selected.length+' / 10 selected';
 fetch('/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run,selected,selectedClicks,submits})}).catch(()=>{});
}
document.addEventListener('click',event=>{if(event.target.matches('input')){selectedClicks++;setTimeout(publish,0);}});
document.querySelector('#reset').onclick=()=>{document.querySelectorAll('input').forEach(el=>el.checked=false);selectedClicks=0;submits=0;run++;publish();};
document.querySelector('#submit').onclick=()=>{submits++;publish();};
publish();
</script></html>
