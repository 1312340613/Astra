name: Launcher compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/launcher/**'
      - 'agent/runtime/paths.py'
      - 'agent/runtime/context_index/embedding_worker.py'
      - 'agent/cli/environment.py'
      - 'astra*'
      - 'start-ink*'
      - 'tests/test_launcher*.py'
      - 'tests/test_embedding_runtime.py'
      - 'tests/test_posix_scripts.py'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'agent/launcher/**'
      - 'agent/runtime/paths.py'
      - 'agent/runtime/context_index/embedding_worker.py'
      - 'agent/cli/environment.py'
      - 'astra*'
      - 'start-ink*'
      - 'tests/test_launcher*.py'
      - 'tests/test_embedding_runtime.py'
      - 'tests/test_posix_scripts.py'
      - '.github/workflows/launcher.yml'

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.27'
          python-version: '3.11.15'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
      - name: Install locked test dependencies
        run: uv sync --locked --extra dev --extra mcp --extra tracing --extra server --extra notebook
      - name: Exercise native launchers and update/recovery contracts
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/test_launcher.py tests/test_launcher_windows_bootstrap.py
          tests/test_launcher_services.py tests/test_launcher_service_launchd.py
          tests/test_launcher_service_windows.py tests/test_launcher_service_embedding.py
          tests/test_embedding_runtime.py tests/test_posix_scripts.py tests/test_instance_lock.py
          tests/test_backend_handshake.py tests/test_cross_platform_examples.py tests/test_production_foundations.py
